name: Coursework documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    name: Validate requirements and build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check checked-in Wiki is current
        run: python scripts/build_docs.py --check
      - name: Validate requirements and links
        run: python scripts/validate.py
      - name: Build offline reader and Wiki files
        run: python scripts/build_docs.py
      - name: Package documentation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mds-documentation
          path: |
            build/
            wiki/
            docs/
          retention-days: 7
          if-no-files-found: error
